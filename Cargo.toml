[package]
name = "lpsql"
description = "[draft] Micro PostgreSQL async driver based on libpq."
version = "0.3.0"
authors = ["Sergei Minaev <i@zenux.ru>"]
edition = "2021"

[[bin]]
name = "lpsql"
path = "src/bin/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pq-sys = "0"
once_cell = "1.19"
rand = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
async-io = "2.3.4"
smol = "2.0.2"
futures-lite = "2.3.0"
async-std = { version = "1.13.0", features = ["unstable"] }
log = "0.4.22"
chrono = "0.4.42"
libc = "0.2.176"
